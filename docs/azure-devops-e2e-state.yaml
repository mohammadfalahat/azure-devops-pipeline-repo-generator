    komodo_stack: "RideSharing_Docker_DevOps-pro-worker"
    komodo_nginx_repo: "RideSharing_Nginx_DevOps-pro-worker"
  migration:
    pipeline: "Find by repository-prefixed desired name/path, then the project-prefixed Server-aware predecessor and earlier allowed legacy names/paths; GET-modify-PUT the same Build Definition ID. Custom Stacks remain isolated. MR considers only MR predecessors."
    release: "Find by exact uppercased Service/optional-Stack/Environment name or Pipeline artifact ID, then reconcile the full Release definition."
  fixes:
    - "Match normal and MR Compose image repositories to their respective Build image names, including the Service punctuation contract."
    - "Use normal Service/optional-Stack .env keys instead of generic IMAGE_TAG in Compose; seed and merge the adjacent tracked .env without replacing existing versions."
    - "Append a missing normal Service to an existing Compose file and correct only its managed image reference on rerun; keep unrelated services and fields."
    - "Omit the explicit project segment from normal and MR YAML filenames/Pipeline names; retain the former project-prefixed Server-aware identity for in-place Build Definition migration. Release display names already omit the project."
    - "Replace native Environment and Stack datalists with locally packaged Tom Select 2.6.2 editable comboboxes so configured options visibly open on click or focus while custom values remain supported."
    - "Keep the native selects as FormData controls, synchronize asynchronous options, values, placeholders, and disabled state through Tom Select, and remove enhanced source selects from the accessibility tree."
    - "Package Tom Select JavaScript, default CSS, and Apache-2.0 license inside dist/vendor so the extension has no CDN dependency."
    - "Add an editable Stack datalist defaulting to default; discover existing Stack names from top-level Docker DevOps directories while continuing to accept a new safe value."
    - "Keep default Stack names byte-compatible; for a custom Stack isolate Compose and configured-Environment Nginx directories, Pipeline/Release names, image/container names, and normal/MR Komodo Repo/Stack identities."
    - "Use <environment>_<stack> for the custom Nginx source directory and sparse checkout, and suffix the custom Komodo Nginx Repo resource so one Stack cannot retarget another Stack resource."
    - "Replace the Environment select with an editable datalist; keep configured-domain Nginx generation, but for a case-insensitively unlisted value generate Pipeline, Release, and Compose only and perform no Nginx repository/file operation."
    - "Replace whitespace in repository-derived and manually edited Service form values with underscores while preserving other punctuation; propagate the normalized value into generated YAML and identities."
    - "Classify semantic frontend aliases under / on port 80, backend/API aliases under /api/ on port 8080, version/new/refactor variants under isolated frontend or /api subpaths, and keep unrelated services under their own names."
    - "Migrate managed legacy service-name Nginx Locations such as /ui-v2/ and /back-v2/ to /v2/ and /api/v2/ idempotently while preserving explicit Monorepo /bff/ routing."
    - "Treat a repository whose name exactly matches its project as the preferred frontend owner of /."
    - "List visible project repositories before support writes and apply a generic semantic-specificity score for / and /api/: exact project match, pure role name, fewer/shorter non-role qualifiers, explicit token boundary, and deterministic tie-breaks; recognize joined forms and demote lower-priority managed owners so execution order cannot change ownership."
    - "Retry only Komodo CreateStack, UpdateStack, and DeployStack responses containing Stack busy for five total attempts with a five-second interval; keep bounded environment overrides and fail unrelated errors immediately."
    - "Include the sanitized editable Service name in normal and MR YAML filenames/Pipeline names so one repository, branch, and Environment can provision multiple Services without collision or overwrite."
    - "Name MR Releases MR <SERVICE> <ENV> instead of MR <ENV>; keep normal Releases as <SERVICE> <ENV>."
    - "Migrate the immediately preceding Service-less normal/MR Pipeline identity in place and retain Pipeline-artifact fallback for legacy Release reconciliation."
    - "Resolve Corepack and pnpm through https://registry.buluttakin.com/repository/npm-group and explicitly bind pnpm's content-addressable store to the existing self-hosted-agent cache mount."
    - "Reserve /api/ for the main application backend and route the Monorepo BFF through /bff/ without rewrite."
    - "Migrate a legacy Monorepo BFF /api/ block only when its managed marker or upstream container proves BFF identity; preserve an ordinary /api/ backend route and reject an unrelated /bff/ owner."
    - "Remove the managed --profile pair from Komodo Stack extra_args and activate the optional BFF with COMPOSE_PROFILES in the tracked .env so Komodo cannot append a global Compose flag after up -d."
    - "Keep managed Monorepo image repositories stable in compose.yml, interpolate service-derived Static/BFF tag keys from the adjacent tracked .env, and create/merge only those managed keys without replacing unrelated entries."
    - "Resolve previous immutable images from tracked .env tags during Build while retaining compatibility with legacy hard-coded Compose image references."
    - "Migrate legacy managed Compose images and .env atomically in Release, update only .env on later runs, and restore the exact previous state of both files before rollback redeploy."
    - "Migrate only exact legacy generated certificate paths such as bulutdemo.pem/key to the complete Environment domain inside the unique matching HTTPS server; preserve quoting, custom paths, unrelated server blocks, and idempotency."
    - "Before any provisioning write, call Komodo ListDockerNetworks for the selected Server and require exact nginx-network or nginx-net."
    - "Preserve an existing logical Compose network key and map its explicit external name to the actual Docker host network."
    - "Print every non-empty Komodo message, command, stdout, and stderr field on MR DeployStack failure so an empty message cannot hide the real Compose error."
    - "Contribute a separate Generate MonoRepo branch action and propagate mode=monorepo through token-free Dialog/Hub context."
    - "Name MR Pipelines <repository>-MR-<service>[-<stack>]-<Branch>To<ENV>EnvOn<SERVER>Srv.yml and MR Releases MR <SERVICE> [<STACK>] <ENV>, under \\komodo\\MR, without migrating normal definitions."
    - "Generate only the create-once /.devops/deployments.yml project contract and make every MR Pipeline import monorepo/pipeline.yml plus monorepo/mr-build.cjs from SharedTemplates."
    - "Package SharedTemplates:/monorepo/nginx/default.conf inside each immutable static image; Compose has no runtime config or project-output bind mount."
    - "Merge missing Monorepo service entries into <environment>[_<stack>]_<project>/compose.yml on main in <Project>_Docker_DevOps; preserve existing services and never create a target-side Compose copy."
    - "Have SharedTemplates:/monorepo/pipeline.yml create or update the Stack-specific Komodo Repo and partially reconcile the matching Docker Stack linked to the shared ADO Compose file, without deploying during Build or replacing unrelated Stack settings."
    - "Have the MR Release commit schema-2 manifest image tags to the shared Compose, execute DeployStack, poll GetUpdate, and commit/redeploy previous tags on failure."
    - "Discover buildable Nx applications and affected applications dynamically; build each selected project independently, retain the prior version of an ordinary failed module, block on shell failure, and build all when shell/host is affected."
    - "Build immutable static and optional BFF images from generic SharedTemplates Dockerfiles; require no Dockerfile in the project and embed the discovered BFF entry in its image."
    - "Route /bff/ to the MR BFF, reserve /api/ for the main backend, and route / to MR static runtime with Docker DNS, no rewrite, and root last."
    - "Remove Komodo Terminal, target-side artifact download, host filesystem, Node, and Docker requirements from Release; deploy only the Git-managed Compose image tags."
    - "Retain removed or renamed module outputs as reported orphans instead of deleting them automatically."
    - "Always resolve both central Git Items reads against the sibling ShonizCollection while preserving an optional Azure DevOps Server /tfs virtual-directory prefix."
    - "Use the same-origin signed-in browser session with redirect suppression and no Authorization header for both central Git reads; never send the current collection's scoped Bearer token to the sibling collection."
    - "Load Environment name/domain records at runtime from ShonizCollection/SharedTemplates/SharedTemplates:/pipeline-generator.yml on main; accept compact name:domain values for migration and ignore legacy servers entries."
    - "Read ShonizCollection/SharedTemplates/SharedTemplates:/komodo-servers-creds.env on main and require KOMODO_ADDRESS, KOMODO_API_KEY, and KOMODO_API_SECRET."
    - "Call Komodo 1.19.5 POST /read ListFullServers directly from the browser using the operator-designated non-confidential Server-Read credential."
    - "Keep deployment selects and Submit disabled when the shared YAML environment list, credential file, or enabled-server result is missing, unreadable, malformed, or empty; never fall back to compiled-in targets."
    - "Retain only config.enabled === true non-template server names and never log, persist, generate YAML from, or package credential values."
    - "Create/reuse <ProjectWithoutSpaces>_Docker_DevOps during Step 1; create/reuse <ProjectWithoutSpaces>_Nginx_DevOps only for an Environment configured with a domain."
    - "Do not create /environments in Docker or Nginx repositories; add the selected Environment/Stack compose.yml only when missing, use one shared <project>-<environment>.conf per Environment/Stack directory, and merge only a missing direct-child service Location."
    - "Parse Nginx comments, quotes, and brace depth; select exactly one matching port-443 server, preserve existing Location/manual bytes, and reject ambiguous or malformed files."
    - "Use sanitized lowercase project plus Environment domain for Nginx server_name, project/service/optional-stack/environment container names, UI/frontend route / on port 80, and other service routes /<service>/ on port 8080."
    - "Enable WebSocket forwarding, client_max_body_size 0, and domain-derived PEM/key paths in Nginx starters."
    - "Always use Docker DNS resolver 127.0.0.11 and set $target; root uses proxy_pass http://$target:80, while non-root uses proxy_pass http://$target:8080 without a URI slash or rewrite so the original request URI is preserved."
    - "Order the managed root Location after every non-root Location and migrate older /<service> paths, direct proxy targets, generated rewrite lines, and incorrect slash forms idempotently."
    - "Stay on the form after provisioning and display Compose and Pipeline links plus an Nginx link only when Nginx was generated, instead of redirecting automatically."
    - "After success, lock repeat submission, collapse the completed form, and focus/scroll the review-links panel; keep the form visible after errors."
    - "Name normal classic Releases using uppercased Service, optional non-default Stack, and Environment; prefix MR Release names with MR while retaining those segments."
    - "Require Service, optional non-default Stack, Environment, and Server in the generated YAML filename and identical Pipeline name: <repository>[-MR]-<service>[-<stack>]-<SanitizedBranch>To<UPPERCASE-ENVIRONMENT>EnvOn<SERVER>Srv.yml."
    - "Migrate the immediately preceding Service-less transition, 0.1.37 Environment-first, and earlier branch-only Pipelines by legacy name/path so Pipeline ID and Release artifact identity are preserved."
    - "Load dist/release-inline-task.sh from the installed extension and embed its complete text as the classic Release Bash task's inline script."
    - "Resolve exact Variable Group KomodoAPI with actionFilter=Use and validate AZP_TOKEN, KOMODO_API_KEY, and KOMODO_API_SECRET names without exposing values."
    - "Link KomodoAPI by numeric ID in the Release definition's top-level variableGroups array and preserve additional existing definition-level groups."
    - "Request vso.variablegroups_read and tag Variable Group authorization failures with that required scope."
    - "Keep the secret-derived Authorization header out of xtrace and process arguments in the packaged Release wrapper."
    - "Read an existing generated YAML as text and skip Git Push entirely when its content already matches, preventing an empty no-op commit."
    - "For exact-name Pipeline reuse, read the canonical full Build Definition before comparing bindings; the target Server's sparse Pipelines by-ID response omits repository.defaultBranch."
    - "Skip Build Definition PUT completely when the full existing binding already matches, preventing a no-op revision increment on rerun."
    - "Request vso.agentpools so the extension token can read project queues and resolve the selected Release queue ID."
    - "Request vso.serviceendpoint so the extension token can read Docker Registry service-connection names/types."
    - "Tag queue authorization failures with the missing extension scope and direct administrators to scope reauthorization."
    - "Use a fixed full-viewport wrapper as the explicit vertical scroll container because root/body scrolling is suppressed by the target legacy iframe."
    - "Never call legacy VSS.resize from the Hub; parameterless resize caused a repeated scrollWidth feedback loop on the target Server."
    - "Bound html to the host viewport and use body-owned internal vertical scrolling without changing contribution width."
    - "Preserve HostAuthorizationNotFound through normalization so every recovery path leads with collection-level extension authorization."
    - "Expose an Open extension authorization action that navigates the parent host to collection extension settings."
    - "Treat HostAuthorizationNotFound as missing or stale collection-level extension authorization, not only an expired user session."
    - "Declare dist/index.html as the pipeline-generator-hub ms.vss-web.hub contribution under Azure Repos."
    - "When openCustomDialog is unavailable, navigate the current host to the extension Hub instead of opening a new tab."
    - "Remove all action-side token acquisition, detached-window, and postMessage bootstrap paths."
    - "Read Hub launch context from legacy getCurrentState or modern getQueryParams host navigation APIs."
    - "Declare dist/index.html as the pipeline-generator-dialog ms.vss-web.control contribution."
    - "Open the generator with host-page-layout openCustomDialog before considering in-host Hub navigation."
    - "Pass only non-secret branch/repository context through dialog configuration."
    - "Acquire the current user's extension token from VSS.getAccessToken inside the hosted generator iframe."
    - "Reveal a full-session reauthentication action when VSS.getAccessToken cannot issue a host token."
    - "Clear the in-memory host token and navigate the parent Azure DevOps host to the collection-relative _signout route."
    - "Never request or accept a PAT in the browser extension."
    - "Keep source and generated repository identities in separate state fields."
    - "Set Pipeline name exactly equal to the generated YAML filename."
    - "Never PUT to /_apis/pipelines/{id}; update through /_apis/build/definitions/{id}."
    - "Compare Pipeline and Release folder casing case-insensitively."
    - "Migrate same-Pipeline Release definitions instead of creating name-based duplicates."

